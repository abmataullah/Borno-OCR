name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ─── Frontend ───
  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx --max-warnings 0 || true

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run --reporter=verbose

      - name: E2E tests
        working-directory: frontend
        run: npx vitest run --config vitest.e2e.config.ts --reporter=verbose

  # ─── Backend ───
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow
          POSTGRES_DB: docflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://docflow:docflow@localhost:5432/docflow
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run migrations
        working-directory: backend
        run: npx drizzle-kit push --force

      - name: Tests
        working-directory: backend
        run: npx vitest run --reporter=verbose

  # ─── Python Worker ───
  worker-test:
    name: Worker Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ben poppler-utils

      - name: Install Python dependencies
        working-directory: worker
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        working-directory: worker
        run: pytest -v

  # ─── Build Docker Images ───
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [frontend-lint-test, backend-lint-test, worker-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t docflow-backend ./backend

      - name: Build worker image
        run: docker build -t docflow-worker ./worker

      - name: Build frontend image
        run: docker build -t docflow-frontend -f infra/frontend.Dockerfile .
