        "ratingValue": "4.8",

    <!-- Structured Data: FAQPage (AEO — answer engine optimization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Can I edit a PDF like a Word document?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. BornoOCR converts your PDF into fully editable text blocks and tables, so you can edit it exactly like a Word document — change text, fonts, alignment, and layout directly in your browser."
          }
        },
        {
          "@type": "Question",
          "name": "Does BornoOCR support Bangla (Bengali) OCR?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. BornoOCR has high-accuracy Bangla OCR with automatic post-correction for common Bangla character errors, plus support for English, Hindi, Sinhala, Tamil, and Arabic. It handles scanned Bangla documents, forms, and tables."
          }
        },
        {
          "@type": "Question",
          "name": "Can BornoOCR edit scanned PDFs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. BornoOCR uses hybrid OCR (PaddleOCR + Surya) to convert scanned PDFs into editable documents, preserving the original layout, tables, and formatting."
          }
        },
        {
          "@type": "Question",
          "name": "Can I extract tables from a PDF into Excel?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. BornoOCR automatically detects tables in PDFs — including scanned ones — and converts them into editable spreadsheet-like tables with support for merged cells and headers. You can then export to DOCX or other formats."
          }
        },
        {
          "@type": "Question",
          "name": "Is BornoOCR free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BornoOCR has a free plan with in-browser OCR editing. Paid plans add high-accuracy server-side OCR, document analysis, form field extraction, and priority processing."
          }
        },
        {
          "@type": "Question",
          "name": "Is my document data secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Free-plan OCR runs entirely in your browser — files never leave your device. Server-side processing uses encrypted transfer, strict access controls, and documents are not shared with third parties."
          }
        }
      ]
    }
    </script>
