version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-docflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docflow}
      POSTGRES_DB: ${DB_NAME:-docflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-docflow}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-docflow}:${DB_PASSWORD:-docflow}@postgres:5432/${DB_NAME:-docflow}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-in-production}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@docflow.local}
      - STORAGE_TYPE=local
      - STORAGE_PATH=/data/uploads
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - BKASH_BASE_URL=${BKASH_BASE_URL:-}
      - BKASH_APP_KEY=${BKASH_APP_KEY:-}
      - BKASH_APP_SECRET=${BKASH_APP_SECRET:-}
      - BKASH_USERNAME=${BKASH_USERNAME:-}
      - BKASH_PASSWORD=${BKASH_PASSWORD:-}
      - SSL_BASE_URL=${SSL_BASE_URL:-}
      - SSL_STORE_ID=${SSL_STORE_ID:-}
      - SSL_STORE_PASSWD=${SSL_STORE_PASSWD:-}
      - BACKEND_URL=http://backend:3001
      - UNOSERVER_URL=http://libreoffice:2003
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://backend:3001
      - UNOSERVER_URL=http://libreoffice:2003
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  libreoffice:
    build:
      context: ../libreoffice-worker
      dockerfile: Dockerfile
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
