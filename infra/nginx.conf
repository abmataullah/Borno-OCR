server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    # Allow embedding inside Banglai Cloud iframe (for the HomeMade Software integration).
    # Replace X-Frame-Options with CSP frame-ancestors for modern browsers.
    add_header Content-Security-Policy "frame-ancestors https://banglai.cloud https://*.banglai.cloud;" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS — allow Banglai Cloud to load assets (pdf.worker, wasm, fonts) cross-origin
    add_header Access-Control-Allow-Origin "https://banglai.cloud" always;

    # Correct MIME types for JS modules (nginx default maps .mjs to octet-stream)
    types {
        application/javascript js mjs;
        text/css css;
        application/wasm wasm;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://backend:3001/health;
    }

    # Upload size
    client_max_body_size 50M;

    # Hide nginx version
    server_tokens off;
}
