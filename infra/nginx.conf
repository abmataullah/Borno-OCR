server {
    listen 80;
    server_name _;

    # Embed-only gate: use BornoOCR through shomoy.io (free trial -> paid), not standalone.
    set $embed_ok 0;
    if ($http_referer ~* "^https://([a-z0-9-]+\.)?shomoy\.io") { set $embed_ok 1; }
    if ($http_referer ~* "^https://pdf\.shomoy\.io") { set $embed_ok 1; }
    if ($uri ~ "^/api/") { set $embed_ok 1; }
    if ($uri = "/health") { set $embed_ok 1; }
    if ($embed_ok = 0) { return 302 https://shomoy.io/homemade-software/bornoocr; }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    # Allow embedding inside Banglai Cloud iframe (for the HomeMade Software integration).
    # Replace X-Frame-Options with CSP frame-ancestors for modern browsers.
    add_header Content-Security-Policy "frame-ancestors https://shomoy.io https://*.shomoy.io;" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS — allow Banglai Cloud to load assets (pdf.worker, wasm, fonts) cross-origin
    add_header Access-Control-Allow-Origin "https://shomoy.io" always;

    # Correct MIME types for JS modules (nginx default maps .mjs to octet-stream)
    types {
        text/html                html htm shtml;
        text/css                 css;
        application/javascript   js mjs;
        application/json         json map;
        application/wasm         wasm;
        application/pdf          pdf;
        image/png                png;
        image/jpeg               jpeg jpg;
        image/svg+xml            svg svgz;
        image/webp               webp;
        image/x-icon             ico;
        font/woff                woff;
        font/woff2               woff2;
        font/ttf                 ttf;
        font/otf                 otf;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://backend:3001/health;
    }

    # Upload size
    client_max_body_size 50M;

    # Hide nginx version
    server_tokens off;
}
